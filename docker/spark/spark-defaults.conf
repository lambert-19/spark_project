# Configuration par défaut de toutes les applications Spark lancées dans le cluster.
# Peut être surchargée dans le code via SparkSession.builder.config(...).

spark.master                     spark://spark-master:7077

# Ressources : chaque application prend au maximum 2 cœurs, ce qui permet
# au job de streaming et à un notebook de tourner en même temps sur le worker (4 cœurs).
spark.cores.max                  2
spark.executor.cores             2
spark.executor.memory            1g
spark.driver.memory              1g

# Event logs : relus par le History Server (http://localhost:18080) pour
# comparer les exécutions avant/après optimisation, même une fois l'application terminée.
spark.eventLog.enabled           true
spark.eventLog.dir               file:///opt/spark-events
spark.history.fs.logDirectory    file:///opt/spark-events

spark.sql.session.timeZone       UTC
